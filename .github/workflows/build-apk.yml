name: build-apk

# Builds an INSTALLABLE Dota 2 container shell APK (icon, label, touch overlay,
# bootstrap, autostart). This is milestone M0: it does NOT bundle Valve game
# files and does NOT claim the game is playable. See docs/05-CI-PIPELINE.md.
on:
  workflow_dispatch:
    inputs:
      bundle_runtime:
        description: 'Download+pack pinned upstream Wine/Box64/Vortek/Goldberg components'
        type: boolean
        default: false
      with_ndk:
        description: 'Build the arm64-v8a JNI probe with the Android NDK'
        type: boolean
        default: true
  push:
    paths:
      - 'android/**'
      - 'runtime/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest images already ship the Android SDK. Avoid a third-party
      # setup action (it failed at startup on the first CI run).
      - name: Install Android SDK / NDK / CMake
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDK="${ANDROID_HOME}"
          SM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SM" ]; then SM="$(command -v sdkmanager)"; fi
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools" \
            "ndk;26.3.11579264" "cmake;3.22.1" 2>&1 | tail -8
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper (no binary jar in Git)
        working-directory: android
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Bundle third-party runtime (optional, offline-safe)
        if: ${{ inputs.bundle_runtime }}
        continue-on-error: true
        run: |
          python -m pip install --quiet py7zr
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd p7zip-full >/dev/null || true
          python runtime/fetch.py --out android/app/src/main/assets/runtime
          ls -lh android/app/src/main/assets/runtime || true

      - name: Regenerate touch profiles
        run: |
          python -m pip install --quiet -r tools/requirements.txt
          python tools/gen_touch_profile.py --out android/app/src/main/assets/dota2

      - name: Assemble debug APK
        working-directory: android
        run: |
          set -o pipefail
          if [ "${{ inputs.with_ndk }}" != "false" ]; then
            ./gradlew assembleDebug -PwithNdk --stacktrace --no-daemon 2>&1 | tee build.log
          else
            ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          fi
          exit ${PIPESTATUS[0]}

      - name: Surface Gradle failure as annotations
        if: failure()
        run: |
          if [ -f android/build.log ]; then
            { grep -A16 'What went wrong' android/build.log | head -18;
              grep -E '^e: |error:|FAILED|Lint found|Execution failed' android/build.log | head -8;
            } | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          fi

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/build.log
          if-no-files-found: warn

      - name: Collect deliverable
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Dota2.apk
          ls -lh Dota2.apk
          echo "### APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "Dota2.apk · arm64-v8a · targetSdk 28 · debug-signed (sideload)" >> "$GITHUB_STEP_SUMMARY"
          echo "Game files are NOT included; copy the full install to /sdcard/Dota2/." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Dota2-apk
          path: Dota2.apk
          if-no-files-found: error
